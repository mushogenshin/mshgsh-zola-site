# The Throughline timeline (Home page → "Throughline" mode).
#
# Edit freely: add or remove entries anywhere in this file. You do NOT manage
# order or layout — entries render chronologically by `year`, and the left/right
# side of the spine auto-alternates over the *visible* entries. Just set the fields.
#
# Fields per entry:
#   id      unique slug (any short kebab-case string; not shown, just a required
#           anchor — it does NOT affect display order)
#   year    displayed year or range, e.g. "1999" or "2005–08" (keep the quotes;
#           the first 4-digit number is what sorts the entry)
#   title   short headline
#   accent  one of: art | code | neutral | life   (see src/config/throughline.ts)
#   body    one or two sentences; `>-` lets you wrap across lines without newlines
#   trivia  OPTIONAL light behind-the-scenes fact; shown only when the "trivia" chip is on
#   life    OPTIONAL `true` = a personal/life beat; hidden unless the "life events" chip is on
#   hobby   OPTIONAL `true` = a side/hobby art project; hidden unless the "hobby projects" chip is on
#   school  OPTIONAL `true` = an education/training milestone; the "school" chip defaults ON
#           (so these show by default; the chip toggles them OFF)
#   side    OPTIONAL 'l'|'r' to pin a side; omit to auto-alternate (use rarely)
#   order   OPTIONAL tiebreaker for entries sharing a year (lower first; default 0)
#   detail  OPTIONAL Thread Detail page (/thread/{slug}); absent → no page. Fields:
#           slug (stable share URL) · standfirst · marginalia · strands [non-work chips]
#           · narrative [paras] · crossSection [{strand, chips:[{label, thread?|work?}]}]
#           · produced [gallery-ids] · hindsight {from, text}. A chip with only `label`
#           is a plain fact; +thread links to another moment; +work opens the in-place
#           work panel. See handoff/thread-detail.md.

- id: pascal-1999
  year: "1999"
  title: First words in Pascal
  accent: code
  body: >-
    A rural, post-war mountain town in Vietnam. The first language I ever
    spoke to a machine.
  trivia: >-
    The whole class shared one computer for an hour a week. I learned loops
    before I owned a pencil sharpener.

