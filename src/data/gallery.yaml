# The Gallery tiles (Home page → "Gallery" mode) and their Work Detail pages.
#
# Edit freely: add or remove tiles anywhere in this file. You do NOT manage grid
# position — tiles render sorted by `meter` (art → code), the same value the bias
# slider culls on. Just set the fields.
#
# Fields per tile:
#   id       unique slug (any short kebab/lowercase string; not shown — the React
#            key + electric-current lookup key + the /work/{id} route. No order effect.)
#   title    tile headline
#   year     number, shown in the tile corner (e.g. 2024)
#   domain   one of: sculpture | anatomy | rigging | unreal | apps | tools | verse
#            (drives the domain filter chips; see src/config/gallery.ts)
#   meter    0 (all art) – 100 (all code). Sets the tile's spot on the spectrum:
#            grid order, the art↔code bias culling, and the electric-current overlay
#            (art-heavy ≤26 / code-heavy ≥74 tiles spark).
#   color    bespoke tile accent, hex — KEEP THE QUOTES (e.g. "#2f8fd4"). Required;
#            it persists even when an image is set (may drive a color strip).
#   blurb    one or two sentences; `>-` wraps across lines without inserting newlines
#   slot     short placeholder text shown in the tile header until an `image` is set
#   href     external link datum — KEEP THE QUOTES. The tile itself now routes to
#            /work/{id}; put the real external URL under `links` for the detail page.
#   image    OPTIONAL cover art. Either an R2 object KEY (recommended, e.g.
#            "cascina/cascina-2016-b.webp" → prefixed with PUBLIC_R2_BASE_URL by
#            r2(), so it migrates with the bucket) OR a full "https://…" URL (used
#            as-is). Replaces the slot placeholder.
#   imageAlt OPTIONAL alt text for the image; defaults to `title`
#   bannerImagePreview  OPTIONAL R2 key (or URL) for a WIDER/alternate glimpse that
#            swaps over the ART|CODE hero banner while this tile is hovered. Use a
#            DIFFERENT asset from `image` (never the thumbnail).
#   bannerFx OPTIONAL pin the reveal effect: wipe | mask | noise. Omit → a random
#            effect is assigned per page load.
#   order    OPTIONAL tiebreaker for tiles sharing a `meter` (lower sorts first)
#
#   ── Work Detail page (/work/{id}) — all OPTIONAL ──
#   standfirst    one-line deck under the H1 (falls back to `blurb`)
#   marginalia    short Gaegu handwritten aside, top-right of the title (rotated −1.5°)
#   status        small outline chip in the title row (e.g. "resuming"); omit to hide
#   yearLabel     display string for the year(s), e.g. "2014 — ongoing" (year is a number)
#   meterNote     Gaegu annotation centered over the big ART↔CODE meter; omit to hide
#   body          list of paragraphs (TRUSTED authored copy — may use inline <em>/<a>)
#   media         list of cells; [0] = 16/10 hero, the rest = side column. Each:
#                   image (R2 key/URL) · alt · caption (dark pill) · placeholder
#                   (faint label for an imageless cell) · color (placeholder bg)
#   tools         list of "materials & tools" chip strings
#   links         list of { label, href } — REAL URLs only, shown as ↗ rows
#   threadContext list of { year, label, active? } — the where-it-sits strip;
#                 mark exactly one node active (the current work)

- id: cascina
  title: Battle of Cascina
  year: 2014
  domain: sculpture
  meter: 8
  color: "#f0c94a"
  blurb: >-
    19 figurative sculptures after Michelangelo’s lost cartoon. Abandoned too soon
    — now resuming.
  slot: figurative sculpt
  image: cascina/cascina-2016-b.webp
  bannerImagePreview: cascina/cascina-2016-a.webp
  # bannerFx: noise
  href: "#"
  standfirst: >-
    A reconstruction of Michelangelo’s lost cartoon as a set of 19 figurative
    sculptures. Abandoned too soon — now resuming.
  marginalia: "19 bathers, surprised mid-river."
  status: "resuming"
  yearLabel: "2014 — ongoing"
  meterNote: "pure sculpture — not a line of code in this one"
  body:
    - >-
      In 2014, fresh out of Scott Eaton’s anatomy and figure-sculpting courses, I
      set out to reconstruct Michelangelo’s lost <em>Battle of Cascina</em> cartoon
      — known to us only through Sangallo’s copy — as a set of nineteen figurative
      sculptures: the Florentine bathers surprised mid-river, every figure a study
      in torsion, urgency, and interrupted rest.
    - >-
      The project became my proving ground. Each figure demanded anatomical
      vocabulary I didn’t yet have, and chasing it is what grew into three years of
      comparative anatomy study, then into teaching it — the foundation that still
      makes every rig and deformation I build read true.
    - >-
      Set down around 2016 when studio work took over — first VFX production, then
      the character pipelines at Virtuos. Now resuming: same cartoon, better hands.
  tools: [ZBrush, clay maquettes, écorché studies, Sangallo copy ref]
  media:
    - image: cascina/cascina-2016-a.webp
      alt: Battle of Cascina — figure group
      caption: figure group · 2016 state
    - image: cascina/cascina-2016-b.webp
      alt: Battle of Cascina — single figure
    - placeholder: wip clay study
      color: "#e78a4e"
    - placeholder: cartoon reference
      color: "#7bc0a0"
  links:
    - label: ArtStation
      href: "https://artstation.com/mushogenshin"
    - label: Sketchfab turntables
      href: "https://sketchfab.com/mushogenshin"
  threadContext:
    - year: "2012"
      label: architecture
    - year: "2014"
      label: Cascina begins
      active: true
    - year: "2016"
      label: Busts
    - year: "2019"
      label: anatomy

