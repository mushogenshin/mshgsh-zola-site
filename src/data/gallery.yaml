- id: anatomy
  title: Comparative Animal Anatomy
  year: 2019
  domain: anatomy
  meter: 24
  color: "#7bc0a0"
  blurb: >-
    Self-taught over three years. The bridge that makes every rig and deformation
    read true.
  slot: anatomy plates
  href: "#"
  standfirst: >-
    Three years teaching myself comparative animal anatomy — the bridge under every
    rig and creature since.
  marginalia: "the bridge to everything after."
  status: "ongoing study"
  yearLabel: "2016 — 2019"
  meterNote: "study first — the code is downstream of this"
  body:
    - >-
      Over roughly three years I taught myself comparative animal anatomy —
      skeleton, musculature, and how they read in motion across species — then
      turned it into training material for human, animal, and creature work and
      taught it to 800+ students in Vietnam and the US.
    - >-
      It’s the quiet foundation the rest of the site stands on: the condor’s
      shoulder, the jellyfish’s drift, the dragons in Control Rig, the anatomy app.
      Nothing downstream reads true without it.
  tools: [écorché, comparative anatomy, teaching material, Maya]
  links:
    - label: ArtStation
      href: "https://artstation.com/mushogenshin"

