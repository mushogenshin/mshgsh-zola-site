- id: fossil
  title: Fossil Skater
  year: 2024
  domain: unreal
  meter: 54
  color: "#2f8fd4"
  blurb: >-
    Shipped. Dinosaurs race on car-shoes. 100% procedural creature animation —
    zero keyframes.
  slot: gameplay clip
  href: "https://fossil-skater.mushogenshin.com"
  standfirst: >-
    A game built solo in three weeks where every creature animation is procedural —
    zero authored keyframes.
  marginalia: "dinosaurs on car-shoes. yes, really."
  status: "coming soon"
  yearLabel: "2024"
  meterNote: "engine-side art — animation that computes itself"
  body:
    - >-
      Dinosaurs race on vehicles worn as skates, one per leg: a T-Rex on two cars
      (eight wheels), a Triceratops on four trucks (sixteen). I built it solo during
      Epic’s Unreal Fellowship — design, art, animation, FX, lighting — in about
      three weeks, and showed it at Unreal Fest Seattle 2024.
    - >-
      Every creature animation is procedural, with zero authored keyframes:
      FullBodyIK and DynamicChain make the legs spread under steering, the spine
      crunch under braking, the neck wobble through direction changes. Both bodies
      steer on four wheels, so the biped comes out twitchy and the quadruped
      ponderous — handling falls out of anatomy rather than tuning.
  tools: [Unreal Engine, FullBodyIK, DynamicChain, Control Rig, Niagara]
  links:
    - label: fossil-skater.mushogenshin.com
      href: "https://fossil-skater.mushogenshin.com"

