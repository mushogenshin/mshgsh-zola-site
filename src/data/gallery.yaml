- id: rusty
  title: Rusty Hunter
  year: 2023
  domain: tools
  meter: 88
  color: "#8fb2e8"
  blurb: >-
    Rewrote a studio’s asset platform from Python into Rust + egui. Scaled to
    100–150 artists, 30+ productions.
  slot: egui screenshot
  href: "#"
  standfirst: >-
    Led the Rust rewrite of a studio’s asset-management platform — 100–150 artists,
    30+ productions.
  marginalia: "nobody asked for this one."
  status: "shipped · adopted studio-wide"
  yearLabel: "2021 — 2024"
  meterNote: "deep in the code — so the artists never have to be"
  body:
    - >-
      The studio’s asset-management app was structurally stuck: a mayapy backend
      frozen on Python 2, a Python 3 frontend, a decade of accretion across ten-plus
      TDs, duck-typed errors surfacing at runtime in front of artists on deadline,
      and a retained-mode UI showing stale state. Nobody asked for a rewrite. I led
      one anyway — in Rust.
    - >-
      Rust so the compiler catches at build time what production was catching at
      runtime; immediate-mode (egui) so stale UI state stopped existing by
      construction. A headless Ubuntu WebSocket service (tokio, protobuf) became the
      real-time shared source of truth for delivery lists — settling the
      concurrent-write conflicts and, just as usefully, the human arguments about what
      had actually shipped.
    - >-
      Random runtime errors essentially disappeared and cold start went instant. It
      scaled to 100–150 artists and ~15 concurrent productions, adopted across 30+
      international projects.
  tools: [Rust, egui, MongoDB, Docker, tokio, protobuf]

