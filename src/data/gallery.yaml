- id: kinetic
  title: KineticRPG
  year: 2025
  domain: unreal
  meter: 80
  color: "#e0531f"
  blurb: >-
    Solo UE 5.8 C++ plugin on GAS — data-asset authoring, a text DSL with
    byte-equal round-trip, node-graph editor.
  slot: editor UI
  href: "#"
  standfirst: >-
    A solo UE 5.8 C++ plugin: a designer-facing authoring layer on the Gameplay
    Ability System, with a text DSL that round-trips byte-for-byte.
  marginalia: "17+ releases, each with a test plan."
  status: "R&D · MegaGrant"
  yearLabel: "2025 — ongoing"
  meterNote: "almost all code — but authored for artists"
  body:
    - >-
      KineticRPG (working name TSUKURU) is a solo UE 5.8 plugin, built as R&amp;D: a
      designer-facing authoring layer over the Gameplay Ability System. Abilities are
      authored as data assets and a small command vocabulary, walked by a chain
      runner, with structured-concurrency primitives — Branch, Defer, Race, Sync —
      modeled on Epic’s Verse.
    - >-
      In-editor tools validate at save time; a text DSL round-trips byte-for-byte
      with the graph; a node editor and both Blueprint and C++ extension surfaces sit
      on top. No parallel runtime — everything routes through native systems.
      Seventeen-plus incremental releases so far, each with a written decision record
      and a per-version test plan; targeting an Epic MegaGrant.
  tools: [Unreal Engine, C++, GAS, plugin architecture, DSL design]

